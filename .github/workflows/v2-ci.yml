name: Risk Copilot V2 CI

on:
  push:
    branches: [main, v2-foundation-m0-m4]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  m0-m4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install V2 test dependencies
        run: python -m pip install -r requirements-v2.txt
      - name: Run M0-M4 functional tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_labels.py tests/test_temporal.py tests/test_pipeline.py
