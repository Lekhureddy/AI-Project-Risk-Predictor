name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run functional tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Validate current web-app artifacts
        run: |
          test -f app.py
          test -f model.pkl
          test -f feature_columns.pkl

      - name: Docker build
        run: docker build -t risk-copilot .
