name: Research data validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build public research cohort
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: src
        run: |
          python scripts/build_research_cohort.py             --repos-file configs/public_repositories.txt             --out data/research             --max-milestones 2

      - name: Produce data-quality report
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_v2_dataset.py             data/research/milestone_features.csv             --report data/research/data_quality_report.json             --min-rows 40             --min-repositories 4             --min-eligible-fraction 0.35 || true

      - name: Attempt research model training only when gate passes
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          p = pathlib.Path("data/research/data_quality_report.json")
          report = json.loads(p.read_text())
          if report.get("blockers"):
              print("Research model not trained because blockers remain:")
              print(json.dumps(report["blockers"], indent=2))
              sys.exit(0)
          subprocess.check_call([
              sys.executable, "scripts/train_risk_model.py",
              "data/research/milestone_features.csv",
              "--out", "artifacts/model",
              "--min-rows", "40",
              "--min-repositories", "4",
              "--min-eligible-fraction", "0.80",
              "--test-size", "0.34"
          ])
          PY

      - name: Record model provenance
        if: hashFiles('artifacts/model/model_report.json') != ''
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/model/model_report.json")
          report = json.loads(p.read_text())
          report["deployment_status"] = "research_demo"
          report["production_approved"] = False
          report["limitations"] = [
              "Small public-repository research cohort",
              "Current due date may be used as a historical proxy",
              "Current milestone membership may be used as a historical proxy when GitHub history is incomplete",
              "Public OSS repositories are not representative of all enterprise teams"
          ]
          p.write_text(json.dumps(report, indent=2))
          PY

      - name: Commit research demo model when training succeeds
        if: hashFiles('artifacts/model/risk_model.pkl') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/model/risk_model.pkl artifacts/model/model_report.json
          git commit -m "model: publish validated research demo artifact" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-copilot-research-results
          path: |
            data/research/*.csv
            data/research/*.json
            artifacts/model/
